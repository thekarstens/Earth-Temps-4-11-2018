<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Jet Stream Particles (NARR 250mb) – Apr 14, 2018</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body { height:100%; margin:0; }
    #map { height:100%; background:#fff; }

    /* Status box (move it away from zoom buttons) */
    .status {
      position:absolute; top:10px; right:10px; z-index:9999;
      background:rgba(255,255,255,0.95);
      border:1px solid #ccc; border-radius:10px;
      padding:8px 10px;
      font:600 12px/1.25 Arial, sans-serif;
      max-width: 320px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
    }

    .legend {
      position:absolute; bottom:14px; left:10px; z-index:9999;
      background:rgba(255,255,255,0.95);
      border:1px solid #ccc; border-radius:10px;
      padding:8px 10px;
      font:600 12px/1.2 Arial, sans-serif;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }
    .legend .row { display:flex; gap:8px; align-items:center; margin-top:4px; }
    .swatch { width:14px; height:10px; border-radius:3px; border:1px solid #444; }

    /* Make layer control a little easier to read */
    .leaflet-control-layers {
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      font: 600 12px/1.2 Arial, sans-serif;
    }
  </style>
</head>

<body>
<div id="map"></div>
<div id="status" class="status">Loading…</div>

<div class="legend" id="legend">
  <div><b>Jet Particles Color (mph)</b></div>
  <div class="row"><span class="swatch" style="background:#bfe9ff"></span><span>0–10</span></div>
  <div class="row"><span class="swatch" style="background:#3aa0ff"></span><span>10–20</span></div>
  <div class="row"><span class="swatch" style="background:#005bff"></span><span>20–30</span></div>
  <div class="row"><span class="swatch" style="background:#00c853"></span><span>30–40</span></div>
  <div class="row"><span class="swatch" style="background:#ffd400"></span><span>40–45</span></div>
  <div class="row"><span class="swatch" style="background:#ff2d2d"></span><span>45–50+</span></div>
</div>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet-Velocity (particles) -->
<script src="https://unpkg.com/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet-velocity@2.1.4/dist/leaflet-velocity.min.css"/>

<script>
  const statusEl = document.getElementById("status");

  // -----------------------------
  // Config
  // -----------------------------
  // Put this JSON in the SAME folder as index.html:
  const JET_VELOCITY_JSON = "./narr_jet_250mb_20180414_18z_leaflet_velocity.json";

  // Your requested ramp: blue -> dark blue -> green -> yellow -> red (0..50 mph)
  // NOTE: Jet stream often exceeds 50 mph, but we can start here for contrast.
  const MPH_MAX = 50;

  // -----------------------------
  // Map
  // -----------------------------
  const map = L.map("map", { zoomControl:true }).setView([44.2, -96.5], 5);

  // Basemap (no toggle)
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap contributors"
  }).addTo(map);

  // -----------------------------
  // State boundaries (toggle, default ON)
  // -----------------------------
  const boundariesLayer = L.geoJSON(null, {
    style: { color:"#444", weight:1, opacity:0.85, fill:false }
  }).addTo(map);

  // Natural Earth states/provinces GeoJSON (host your own later if you want it faster/offline)
  const statesGeoJSON =
    "https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_admin_1_states_provinces_scale_rank.geojson";

  fetch(statesGeoJSON, { cache:"force-cache" })
    .then(r => r.json())
    .then(gj => boundariesLayer.addData(gj))
    .catch(err => console.warn("Boundaries failed:", err));

  // -----------------------------
  // Helpers
  // -----------------------------
  function clamp(x, a, b){ return Math.max(a, Math.min(b, x)); }
  function lerp(a,b,t){ return a + (b-a)*t; }
  function lerpColor(c1, c2, t){
    return [
      Math.round(lerp(c1[0], c2[0], t)),
      Math.round(lerp(c1[1], c2[1], t)),
      Math.round(lerp(c1[2], c2[2], t))
    ];
  }
  function rgbCss(c){ return `rgb(${c[0]},${c[1]},${c[2]})`; }

  // Piecewise ramp for mph 0..50:
  // 0    -> light blue
  // 20   -> medium blue
  // 30   -> deep blue
  // 40   -> green
  // 45   -> yellow
  // 50+  -> red
  function colorForMph(mph){
    mph = clamp(mph, 0, MPH_MAX);

    const c0  = [191,233,255]; // light blue
    const c20 = [ 58,160,255]; // blue
    const c30 = [  0, 91,255]; // deep blue
    const c40 = [  0,200, 83]; // green
    const c45 = [255,212,  0]; // yellow
    const c50 = [255, 45, 45]; // red

    if (mph <= 20) return rgbCss(lerpColor(c0,  c20, mph/20));
    if (mph <= 30) return rgbCss(lerpColor(c20, c30, (mph-20)/10));
    if (mph <= 40) return rgbCss(lerpColor(c30, c40, (mph-30)/10));
    if (mph <= 45) return rgbCss(lerpColor(c40, c45, (mph-40)/5));
    return rgbCss(lerpColor(c45, c50, (mph-45)/5));
  }

  // Convert m/s to mph (velocity layer data are m/s per header) :contentReference[oaicite:1]{index=1}
  function msToMph(ms){ return ms * 2.23694; }

  // -----------------------------
  // Jet particles layer (leaflet-velocity)
  // -----------------------------
  let jetVelocityLayer = null;

  async function loadJetParticles(){
    statusEl.textContent = "Loading jet stream particles…";

    const resp = await fetch(JET_VELOCITY_JSON + "?v=" + Date.now(), { cache:"no-store" });
    if (!resp.ok) throw new Error(`Jet JSON HTTP ${resp.status}`);
    const data = await resp.json();

    // Get timestamp from the first record header (u-wind record)
    let refTime = "";
    try { refTime = data?.[0]?.header?.refTime || ""; } catch(e){}

    // If already exists, remove and rebuild
    if (jetVelocityLayer && map.hasLayer(jetVelocityLayer)) map.removeLayer(jetVelocityLayer);
    jetVelocityLayer = L.velocityLayer({
      displayValues: true,
      displayOptions: {
        velocityType: "Jet Wind (250mb)",
        displayPosition: "bottomleft",
        displayEmptyString: "No wind data",
        speedUnit: "mph"
      },

      // Visual tuning
      particleAge: 45,
      particleMultiplier: 1/200,   // smaller = fewer particles (faster). Increase for denser.
      lineWidth: 1,
      velocityScale: 0.010,        // lower = slower particle motion
      opacity: 0.55,               // your request: less opaque / clearer

      // Data bounds: leaflet-velocity will place it using the header grid.
      data: data,

      // Color: leaflet-velocity passes speed in m/s (from u/v). We convert to mph for ramp.
      colorScale: (ms) => colorForMph(msToMph(ms))
    });

    // Add by default
    jetVelocityLayer.addTo(map);

    statusEl.innerHTML =
      `<b>Jet particles loaded</b><br>` +
      (refTime ? `Time: <b>${refTime}</b><br>` : "") +
      `File: narr_jet_250mb_20180414_18z_leaflet_velocity.json`;
  }

  // -----------------------------
  // Layer control (overlays only)
  // -----------------------------
  const overlays = {
    "State Boundaries": boundariesLayer
    // Jet layer is added after load, then injected below
  };

  const layerControl = L.control.layers(null, overlays, { collapsed:false }).addTo(map);

  // Load particles and then register toggle
  loadJetParticles()
    .then(() => {
      layerControl.addOverlay(jetVelocityLayer, "Jet Stream (250mb) – Particles");
    })
    .catch(err => {
      console.error(err);
      statusEl.textContent = "Error loading jet particles: " + err.message;
    });

</script>
</body>
</html>
